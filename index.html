<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Špelčin Wordle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Guess the Word!</h1>
    <div class="grid">
        <div class="row">
            <div class="cell" id="cell-0"></div>
            <div class="cell" id="cell-1"></div>
            <div class="cell" id="cell-2"></div>
            <div class="cell" id="cell-3"></div>
            <div class="cell" id="cell-4"></div>
        </div>
                <div class="row">
            <div class="cell" id="cell-5"></div>
            <div class="cell" id="cell-6"></div>
            <div class="cell" id="cell-7"></div>
            <div class="cell" id="cell-8"></div>
            <div class="cell" id="cell-9"></div>
        </div>
                <div class="row">
            <div class="cell" id="cell-10"></div>
            <div class="cell" id="cell-11"></div>
            <div class="cell" id="cell-12"></div>
            <div class="cell" id="cell-13"></div>
            <div class="cell" id="cell-14"></div>
        </div>
                <div class="row">
            <div class="cell" id="cell-15"></div>
            <div class="cell" id="cell-16"></div>
            <div class="cell" id="cell-17"></div>
            <div class="cell" id="cell-18"></div>
            <div class="cell" id="cell-19"></div>
        </div>
                <div class="row">
            <div class="cell" id="cell-20"></div>
            <div class="cell" id="cell-21"></div>
            <div class="cell" id="cell-22"></div>
            <div class="cell" id="cell-23"></div>
            <div class="cell" id="cell-24"></div>
        </div>
    </div>

    <div class="grid">

        <div class="keyrow" style="padding-top: 25px;">
            <div class="key" id="cell-Q">Q</div>
            <div class="key" id="cell-W">W</div>
            <div class="key" id="cell-E">E</div>
            <div class="key" id="cell-R">R</div>
            <div class="key" id="cell-T">T</div>
            <div class="key" id="cell-Y">Y</div>
            <div class="key" id="cell-U">U</div>
            <div class="key" id="cell-I">I</div>
            <div class="key" id="cell-O">O</div>
            <div class="key" id="cell-P">P</div>
        </div>
                <div class="keyrow">
            <div class="key" id="cell-A">A</div>
            <div class="key" id="cell-S">S</div>
            <div class="key" id="cell-D">D</div>
            <div class="key" id="cell-F">F</div>
            <div class="key" id="cell-G">G</div>
            <div class="key" id="cell-H">H</div>
            <div class="key" id="cell-J">J</div>
            <div class="key" id="cell-K">K</div>
            <div class="key" id="cell-L">L</div>
        </div>
                <div class="keyrow">
            <div class="key" id="cell-ENTER" style="width: 80px;">Enter</div>
            <div class="key" id="cell-Z">Z</div>
            <div class="key" id="cell-X">X</div>
            <div class="key" id="cell-C">C</div>
            <div class="key" id="cell-V">V</div>
            <div class="key" id="cell-B">B</div>
            <div class="key" id="cell-N">N</div>
            <div class="key" id="cell-M">M</div>
            <div class="key" id="cell-BACKSPACE" style="width: 80px;">Delete</div>
        
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
<footer style="padding-top: 160px; color: white; font-size: 14px; align-items: center; justify-content: center; display: flex;">
    © 2026 Patrick d.o.o, Sitemap Privacy Policy, Terms of Service, Cookie Policy

</footer>
</html>
